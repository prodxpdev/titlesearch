name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and invariant checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test-node:
    name: Test (Node LTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
      - name: Let Chrome's sandbox run on Ubuntu 24.04
        # The renderer isolation suite drives a real Chrome. Ubuntu 24.04
        # restricts unprivileged user namespaces, which Chrome's sandbox needs.
        # Lifting that is better than running Chrome with --no-sandbox.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Start the DynamoDB and Firestore emulators
        # The cloud cache stores run the conformance suite against these.
        run: |
          docker run -d -p 127.0.0.1:8000:8000 amazon/dynamodb-local@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab -jar DynamoDBLocal.jar -inMemory
          docker run -d -p 127.0.0.1:8080:8080 gcr.io/google.com/cloudsdktool/google-cloud-cli@sha256:8d8573471c489a409f03891d2c24d177fa531276184f7002b9a2d853d1b3ed54 gcloud emulators firestore start --host-port=0.0.0.0:8080
          for port in 8000 8080; do
            timeout 120 bash -c "until curl -s -o /dev/null http://127.0.0.1:$port/; do sleep 2; done"
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          DYNAMODB_ENDPOINT: http://127.0.0.1:8000
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          TITLESEARCH_REQUIRE_EMULATORS: "1"

  test-bun:
    name: Test (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Let Chrome's sandbox run on Ubuntu 24.04
        # The renderer isolation suite drives a real Chrome. Ubuntu 24.04
        # restricts unprivileged user namespaces, which Chrome's sandbox needs.
        # Lifting that is better than running Chrome with --no-sandbox.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      # Run the same Vitest suites with Bun as the runtime.
      - run: pnpm -r --workspace-concurrency=1 exec bun --bun vitest run --passWithNoTests
      # The CLI ships as a `bun build --compile` binary; prove SQLite works inside one.
      - name: Compiled SQLite smoke test
        run: |
          bun build --compile packages/cache/scripts/compile-smoke.ts --outfile "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke"
      - name: End-to-end tests (Playwright, installed Chrome)
        run: |
          pnpm --filter @titlesearch/web build
          pnpm --filter @titlesearch/web e2e
      - name: Build the CLI binary
        run: |
          node apps/cli/scripts/embed-ui.mjs
          bun build --compile apps/cli/src/main.ts --outfile "$RUNNER_TEMP/titlesearch"
          "$RUNNER_TEMP/titlesearch" --version

  test-workers:
    name: Test (Workers, Miniflare)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:workers

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check every commit has Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $sha has no Signed-off-by line. See CONTRIBUTING.md."
              missing=1
            fi
          done
          exit $missing

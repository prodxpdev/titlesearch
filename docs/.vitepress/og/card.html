<!doctype html>
<!--
  The link-preview card (OpenGraph and X), 1200 by 630. To regenerate
  docs/public/og.png after editing, from the repository root:

    pnpm --dir apps/web exec playwright screenshot --viewport-size=1200,630 \
      "file://$PWD/docs/.vitepress/og/card.html" "$PWD/docs/public/og.png"
-->
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Schibsted Grotesk";
        font-weight: 400;
        src: url("../../node_modules/@fontsource/schibsted-grotesk/files/schibsted-grotesk-latin-400-normal.woff2");
      }
      @font-face {
        font-family: "Schibsted Grotesk";
        font-weight: 800;
        src: url("../../node_modules/@fontsource/schibsted-grotesk/files/schibsted-grotesk-latin-800-normal.woff2");
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #16233b;
        color: #f4f6fa;
        font-family: "Schibsted Grotesk", sans-serif;
        position: relative;
      }
      .text {
        position: absolute;
        left: 72px;
        top: 70px;
        width: 520px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-weight: 800;
        font-size: 32px;
        letter-spacing: -0.01em;
      }
      h1 {
        margin: 52px 0 0;
        font-weight: 800;
        font-size: 60px;
        line-height: 1.04;
        letter-spacing: -0.03em;
      }
      p {
        margin: 26px 0 0;
        font-size: 24px;
        line-height: 1.4;
        color: #b9c4d6;
      }
      .url {
        position: absolute;
        left: 72px;
        bottom: 58px;
        font-size: 22px;
        color: #8fb3dc;
        letter-spacing: 0.01em;
      }
      .shot {
        position: absolute;
        left: 650px;
        top: 92px;
        width: 760px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="text">
      <div class="brand">
        <svg width="44" height="44" viewBox="0 0 26 26" aria-hidden="true">
          <rect x="1.5" y="1.5" width="23" height="23" rx="3" fill="#fff" stroke="#fff" stroke-width="2" />
          <path d="M1.5 10h23M10 10v14.5M17 10v14.5" stroke="#16233B" stroke-width="1.5" stroke-dasharray="2 2" />
          <rect x="10.8" y="10.8" width="5.4" height="5.4" fill="#2F5D8C" />
        </svg>
        Titlesearch
      </div>
      <h1>Is the name free, and who lives next door?</h1>
      <p>Check a name across domain extensions, see what's on the taken ones, and whether it competes.</p>
    </div>
    <div class="url">titlesearch.app · free and open source</div>
    <img class="shot" src="../../public/screens/results.jpg" alt="" />
  </body>
</html>

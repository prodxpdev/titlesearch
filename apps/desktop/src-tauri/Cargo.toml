[package]
name = "titlesearch-desktop"
version = "0.2.4"
description = "Titlesearch desktop: a thin Tauri shell around the titlesearch binary."
authors = ["ProdXP LLC"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "titlesearch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.4"
tauri-plugin-opener = "2.7"
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.13"
keyring = "4.2"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-log = "2.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Titlesearch</title>
    <style>
      body { margin: 0; height: 100vh; display: grid; place-items: center; background: #16233b;
             color: #fff; font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; }
      main { max-width: 26rem; padding: 2rem; text-align: center; }
    </style>
  </head>
  <body>
    <!-- Shown only if Titlesearch couldn't start; the app normally opens its local server. -->
    <main>
      <h1>Titlesearch couldn't start</h1>
      <p id="detail">Quit and open it again. If it keeps happening, run <code>titlesearch serve</code> in a terminal to see why.</p>
    </main>
  </body>
</html>
